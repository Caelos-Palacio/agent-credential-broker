[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-credential-broker"
version = "0.1.0"
description = "Local isolated custodian for approved authenticated actions"
requires-python = ">=3.12"
dependencies = ["cryptography==50.0.2"]
license = "MIT"

[project.scripts]
agent-credential-broker = "credential_broker.cli:main"

[tool.setuptools.packages.find]
include = ["credential_broker*"]
