name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements.lock -r requirements-build.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -I -c "import credential_broker.host, credential_broker.cli"
      - run: python scripts/assurance.py --all
      - run: python -m compileall -q credential_broker
      - run: python -m pip check

  solidity-local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: assurance/solidity
    env:
      ASSURANCE_SOLC: /tmp/broker-assurance-solc-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download and verify the pinned official compiler
        run: |
          curl --fail --location --max-time 60 \
            'https://raw.githubusercontent.com/ethereum/solc-bin/gh-pages/linux-amd64/solc-linux-amd64-v0.8.37+commit.f401782d' \
            -o "$ASSURANCE_SOLC"
          printf '%s  %s\n' '5de843c2c93563cc66425c99a4fb13fdbf32b4c4ae07469480faaf126e14404a' "$ASSURANCE_SOLC" | sha256sum --check -
          chmod 700 "$ASSURANCE_SOLC"
      - run: npm test
